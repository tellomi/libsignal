# Tellomi: 上游出新 release tag 后自动开「候选 rebase PR」（tellomi/tellomi#995）。
# 只做机械部分：找最新非 beta/rc/hotfix tag → 把我们在 `tellomi` 分支上的补丁 rebase 到它 → 零冲突就推 `sync/<tag>` 并开 PR，
# 有冲突就开 Issue 列出冲突文件。永远不自动合并；「合不合理」由人审 PR（审核清单见 PR 正文）。
# 同一份文件放在每个 tellomi/* fork 的 `tellomi` 分支；上游仓库从 fork 的 parent 自动取，不用改。
name: tellomi-upstream-rebase
on:
  schedule:
    - cron: '0 2 * * 1' # 每周一 10:00（北京）
  workflow_dispatch:
    inputs:
      tag:
        description: '指定上游 tag（留空 = 最新非 beta/rc/hotfix）'
        required: false
        default: ''
      dry_run:
        description: '只演练：不推分支、不开 PR/Issue，只在日志里给结果'
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency: tellomi-upstream-rebase
jobs:
  rebase:
    runs-on: ubuntu-latest
    env:
      # 组织没开「Allow GitHub Actions to create and approve pull requests」→ GITHUB_TOKEN 开不了 PR；配了 fine-grained PAT（secrets.TELLOMI_BOT_TOKEN）就用它
      GH_TOKEN: ${{ secrets.TELLOMI_BOT_TOKEN || github.token }}
      OURS: tellomi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tellomi
          fetch-depth: 0
      - name: 取上游 tags
        run: |
          set -euo pipefail
          PARENT=$(gh api "repos/$GITHUB_REPOSITORY" --jq .parent.full_name)
          [ -n "$PARENT" ] || { echo "::error::$GITHUB_REPOSITORY 不是 fork，没有 parent"; exit 1; }
          git remote add upstream "https://github.com/$PARENT.git"
          git fetch -q upstream --tags
          echo "PARENT=$PARENT" >> "$GITHUB_ENV"
      - name: 定基线与目标
        id: pick
        run: |
          set -euo pipefail
          # 上游「纯版本号 release tag」按版本降序（去掉可有可无的 v 前缀比较；storage-service 2026-08 起 tag 不带 v；libsignal 的 ts-0.3.3、Desktop 的 @signalapp/types@… 不算；带 - 的 beta/rc/自打 tag 不算）
          git ls-remote --tags --refs upstream | sed 's|.*refs/tags/||' | grep -E '^v?[0-9]+(\.[0-9]+)*$' > /tmp/upstream-tags.txt
          sed 's/^v//' /tmp/upstream-tags.txt | sort -rV | while read -r v; do grep -xE "v?$(printf '%s' "$v" | sed 's/[.]/\\./g')" /tmp/upstream-tags.txt | head -1 || true; done > /tmp/upstream-tags-sorted.txt
          # 基线 = 上游 tag 里「是 tellomi 分支祖先」的最新一个。不用 merge-base upstream/main：Signal-Desktop 的 main 早就不是主干（release 在 8.27.x 这类分支上），merge-base 会退到 2021 的 v5.12.2
          BASE=""; BASE_COMMIT=""
          while read -r t; do
            if git merge-base --is-ancestor "$t" "$OURS"; then BASE="$t"; BASE_COMMIT=$(git rev-parse "$t^{commit}"); break; fi
          done < /tmp/upstream-tags-sorted.txt
          [ -n "$BASE" ] || { echo "::error::找不到是 $OURS 祖先的上游 release tag"; exit 1; }
          TARGET='${{ inputs.tag }}'
          [ -n "$TARGET" ] || TARGET=$(head -1 /tmp/upstream-tags-sorted.txt)
          git rev-parse -q --verify "refs/tags/$TARGET" >/dev/null || { echo "::error::tag 不存在：$TARGET"; exit 1; }
          OURS_N=$(git rev-list --count "$BASE_COMMIT..$OURS" --no-merges)
          UP_N=$(git rev-list --count "$BASE..$TARGET")
          echo "基线 $BASE（$BASE_COMMIT）· 目标 $TARGET · 我们的补丁 $OURS_N 个 · 上游新增 $UP_N 个提交"
          {
            echo "base=$BASE"; echo "base_commit=$BASE_COMMIT"; echo "target=$TARGET"
            echo "ours_n=$OURS_N"; echo "up_n=$UP_N"
            if [ "$BASE" = "$TARGET" ]; then echo "skip=true"; else echo "skip=false"; fi
          } >> "$GITHUB_OUTPUT"
          [ "$BASE" != "$TARGET" ] || echo "::notice::已对齐上游最新 tag $TARGET，无事可做"
      - name: 试 rebase
        id: rebase
        if: steps.pick.outputs.skip == 'false'
        run: |
          set -uo pipefail
          git config user.name  'tellomi-upstream-rebase'
          git config user.email 'bot@tellomi.app'
          T='${{ steps.pick.outputs.target }}'; B='${{ steps.pick.outputs.base }}'
          git checkout -q -b "sync/$T" "$OURS"
          if git rebase --onto "$T" "$B" 2>&1 | tail -20; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            git diff --stat "$T..HEAD" > /tmp/diffstat.txt
            git log --oneline "$T..HEAD" > /tmp/ours.txt
            echo "零冲突：$(wc -l < /tmp/ours.txt) 个补丁落在 $T 上"; cat /tmp/diffstat.txt
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            STOPPED=$(git log -1 --format='%h %s' REBASE_HEAD 2>/dev/null || echo '?')
            echo "stopped=$STOPPED" >> "$GITHUB_OUTPUT"
            echo "::warning::rebase 在补丁「$STOPPED」处冲突："; cat /tmp/conflicts.txt
            git rebase --abort || true
          fi
      - name: 推分支 + 开 / 更新 PR
        if: steps.pick.outputs.skip == 'false' && steps.rebase.outputs.ok == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          T='${{ steps.pick.outputs.target }}'; B='${{ steps.pick.outputs.base }}'
          git push -q --force-with-lease origin "sync/$T"
          BODY=$(cat <<EOF
          自动生成（\`tellomi-upstream-rebase\`）：把 \`$OURS\` 上的 **${{ steps.pick.outputs.ours_n }} 个补丁** 从 \`$B\` rebase 到上游 **\`$T\`**（上游新增 ${{ steps.pick.outputs.up_n }} 个提交，零冲突）。
          上游 release：https://github.com/$PARENT/releases/tag/$T · 对比：https://github.com/$PARENT/compare/$B...$T

          ## 我们的全部改动（= 审查面，\`git diff $T..sync/$T --stat\`）
          \`\`\`
          $(cat /tmp/diffstat.txt)
          \`\`\`
          <details><summary>补丁列表</summary>

          \`\`\`
          $(cat /tmp/ours.txt)
          \`\`\`
          </details>

          ## 合并前清单（tellomi/tellomi#995；docs/signal/VERSIONS.md「升级」）
          - [ ] 上游 release notes：安全修复 / 协议变更 / 最低客户端版本 三类看过
          - [ ] 上面 diff 逐文件过一遍；上游改到了我们改过的文件 → 逐文件看
          - [ ] 本机真跑：构建 + 本地栈 / 模拟器注册闭环 + 残留审计 + 常量漂移 全绿
          - [ ] 合并方式：\`$OURS\` 分支 fast-forward 到本分支（不 force）；超级仓库改 submodule 指针 + VERSIONS.md + upstream-check.sh 钉住值，走 PR + 对方 review
          EOF
          )
          LINK="https://github.com/$GITHUB_REPOSITORY/compare/$OURS...sync/$T?expand=1"
          TITLE="上游同步候选：$B → $T（${{ steps.pick.outputs.ours_n }} 个补丁零冲突）"
          { echo "## $TITLE"; echo; echo "分支 \`sync/$T\` 已推好 → 开 PR：$LINK"; echo; echo "$BODY"; } >> "$GITHUB_STEP_SUMMARY"
          # 开 PR / Issue 都是尽力而为：组织没开「Allow GitHub Actions to create and approve pull requests」且 GITHUB_TOKEN 被限成只读时，
          # 两个都会 "Resource not accessible by integration"。分支与 summary 已经是完整交付；Mac 上的 upstream-watch.sh 每月会把各 fork 的 sync/* 分支列进超级仓库 Issue。
          N=$(gh pr list --head "sync/$T" --base "$OURS" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then gh pr edit "$N" --body "$BODY" >/dev/null && echo "已更新 PR #$N"
          elif gh pr create --head "sync/$T" --base "$OURS" --title "$TITLE" --body "$BODY" 2>/tmp/pr.err; then echo "已开 PR"
          else
            echo "::warning::GITHUB_TOKEN 开不了 PR（$(cat /tmp/pr.err | head -1)）；试开 Issue"
            N=$(gh issue list --search "\"$TITLE\" in:title" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$N" ]; then gh issue comment "$N" --body "分支已更新：$LINK" >/dev/null && echo "已评论 Issue #$N"
            elif gh issue create --title "$TITLE" --body "分支 \`sync/$T\` 已推好，开 PR：$LINK"$'\n\n'"$BODY" 2>/tmp/issue.err; then echo "已开 Issue"
            else echo "::warning::Issue 也开不了（$(head -1 /tmp/issue.err)）。分支已推：$LINK（配 secrets.TELLOMI_BOT_TOKEN 可解）"; fi
          fi
      - name: 冲突 → 开 / 更新 Issue
        if: steps.pick.outputs.skip == 'false' && steps.rebase.outputs.ok == 'false' && inputs.dry_run != true
        run: |
          set -euo pipefail
          T='${{ steps.pick.outputs.target }}'; B='${{ steps.pick.outputs.base }}'
          TITLE="上游同步冲突：$B → $T"
          BODY=$(cat <<EOF
          自动生成（\`tellomi-upstream-rebase\`）：把 \`$OURS\` 的补丁 rebase 到 \`$T\` 时在补丁「${{ steps.rebase.outputs.stopped }}」处冲突。需要人工在本机解：
          \`\`\`
          git fetch upstream --tags && git checkout -b sync/$T $OURS && git rebase --onto $T $B
          \`\`\`
          ## 冲突文件
          \`\`\`
          $(cat /tmp/conflicts.txt)
          \`\`\`
          上游对比：https://github.com/$PARENT/compare/$B...$T
          EOF
          )
          { echo "## $TITLE"; echo; echo "$BODY"; } >> "$GITHUB_STEP_SUMMARY"
          N=$(gh issue list --search "\"$TITLE\" in:title" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY" >/dev/null || echo "::warning::Issue 评论失败（GITHUB_TOKEN 权限），看本次 job summary"
          else gh issue create --title "$TITLE" --body "$BODY" || echo "::warning::开不了 Issue（GITHUB_TOKEN 权限），冲突清单在本次 job summary"; fi
          exit 1  # 冲突本身就是需要人处理的失败
