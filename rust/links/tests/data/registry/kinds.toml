# kind 词汇表（ADR-0063 §4.6）：Extractor 与 Renderer 之间的契约。
# 改这张表 = 改客户端的渲染器，要随客户端发版；注册表热更只能用已有的 kind（lint L7）。
# required 里的名字：title / description / image 指 snapshot（Preview 1–5），其余是 attrs 的键。
# required_any：几组里满足任意一组即可（地点：有坐标，或者至少有名字）。
# reserved = true：还没有稳定的结构化来源，只作品牌壳上的「类型」文字；结构化 plan 不许产出它的 attrs。
schema = 1

[attr_types]
string = "纯文本，1–256 个字符，渲染时永远不当链接"
int = "十进制非负整数"
duration_ms = "非负整数毫秒"
datetime = "RFC 3339 时间"
lat = "十进制纬度，[-90, 90]"
lng = "十进制经度，[-180, 180]"
coord_sys = "wgs84 | gcj02 | bd09"
platform = "ios | android"

[[kind]]
id = "tellomi.user"
first_party = true
required = []
attrs = {}

[[kind]]
id = "tellomi.group"
first_party = true
required = ["title"]
attrs = { member_count = "int" }

[[kind]]
id = "tellomi.call"
first_party = true
required = []
attrs = {}

[[kind]]
id = "tellomi.sticker"
first_party = true
required = ["title"]
attrs = { sticker_count = "int" }

[[kind]]
id = "tellomi.official"
first_party = true
required = []        # 卡片显示固定文字「Tellomi 官网」加路径，不靠 snapshot 标题（§4.8）
attrs = {}

[[kind]]
id = "video"
required = ["title", "image"]
attrs = { author = "string", duration_ms = "duration_ms", published_at = "datetime" }

[[kind]]
id = "channel"
required = ["title"]
attrs = { author = "string" }   # 直播间 / 频道主页；永不带在播状态（§3.4.12）

[[kind]]
id = "music.track"
required = ["title"]
attrs = { artist = "string", album = "string", duration_ms = "duration_ms" }

[[kind]]
id = "music.album"
required = ["title"]
attrs = { artist = "string", track_count = "int" }

[[kind]]
id = "music.playlist"
required = ["title"]
attrs = { author = "string", track_count = "int" }

[[kind]]
id = "place"
required_any = [["lat", "lng", "coord_sys"], ["name"]]
attrs = { lat = "lat", lng = "lng", coord_sys = "coord_sys", name = "string", address = "string" }

[[kind]]
id = "app"
required = ["title", "image"]
attrs = { developer = "string", platform = "platform" }

[[kind]]
id = "repo"
required = ["title"]
attrs = { owner = "string" }

# —— 预留：品牌壳上的类型文字 ——
[[kind]]
id = "article"
reserved = true

[[kind]]
id = "product"
reserved = true

[[kind]]
id = "package"
reserved = true

[[kind]]
id = "question"
reserved = true

[[kind]]
id = "deal"
reserved = true

[[kind]]
id = "ride"
reserved = true      # 一次性对象：网约车行程分享（§3.4.10）

[[kind]]
id = "payment"
reserved = true      # 支付 / 金融页（§6.6）

[[kind]]
id = "web"
reserved = true      # 品牌壳在路径认不出对象时的类型
