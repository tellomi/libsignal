schema = 1
id = "iqiyi"
name = { zh-Hans = "爱奇艺", en = "iQIYI" }
# 2026-10-19（owner 定，#claimed-tier）：从 brand 挪到 claimed——注册表仍认领（随包图标、http / 没写协议的链接按 https 出卡片、仿冒提醒、
# 打开规则照旧），但发送端像普通链接一样抓页面（标题、描述、图片或站点图标）；页面没给标题（风控页、JS 页）时退回品牌壳。
# 2026-10-19 本机实测（WhatsApp/2 UA）：首页和播放页有标题和描述（Safari UA 的播放页标题更好）。
tier = "claimed"
category = "video"
icon = "iqiyi.png"
# 视频页只对浏览器 UA 给对象级 OG，对 WhatsApp/2 是站点级 <title>（§3.4.1 → 品牌壳）。没找到分享短链主机；
# App 分享是 m.iqiyi.com/m/playShare?shareId=…（301 到 www.iqiyi.com/playShare.html），认不出对象。
domains = ["www.iqiyi.com", "iqiyi.com", "m.iqiyi.com"]
strip_params = ["social_platform", "vfm", "vfrm", "vfrmblk", "vfrmrst", "frmrp", "frmrs", "ht", "s2", "s3", "s4"]
evidence = "ecosystem-2026-09-23/G4-video-audio.md「爱奇艺」；RECHECK.md 口径 2（只给浏览器 UA）；2026-09-27 首批复核（#1419 PR）"

[[route]]
id = "video"
path = '^/v_(?P<id>[0-9a-z]{8,16})\.html$'
kind = "video"
object = "{id}"
plan = [{ type = "none" }]
