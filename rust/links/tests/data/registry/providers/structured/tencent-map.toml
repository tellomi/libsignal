schema = 1
id = "tencent-map"
name = { zh-Hans = "腾讯地图", en = "Tencent Maps" }
tier = "structured"
category = "maps"
# 腾讯地图没有找到真实的分享短链（2026-09-27 检索）；外面流通的都是 URI API 的长链接。
domains = ["apis.map.qq.com", "map.qq.com", "mapapi.qq.com"]
strip_params = ["referer", "key", "ADTAG"]
evidence = "URI API 文档 https://lbs.qq.com/webApi/uriV1/uriGuide/uriWebMarker（marker=coord:纬度,经度;title:…;addr:…，缺省腾讯坐标 = GCJ-02，coord_type=1 为 GPS）；2026-09-27 首批复核（#1419 PR）"

# marker 的值形如 coord:<lat>,<lng>;title:<名称>;addr:<地址>，值先整体解码再匹配（%3A %2C %3B 都会解开）。
[[route]]            # coord_type=1：GPS（WGS-84）坐标
id = "marker-gps"
host = "apis.map.qq.com"
path = '^/(?:uri/v1/marker|tools/poimarker)$'
query = { marker = '^coord:(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)(?:;title:(?P<name>[^;]{1,64}))?(?:;addr:(?P<address>[^;]{0,128}))?$', coord_type = '^1$' }
kind = "place"
attrs = { coord_sys = "wgs84" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}", name = "{name}", address = "{address}" } }]

[[route]]            # /uri/v1/marker 302 到 /tools/poimarker，同一种 marker 参数
id = "marker"
host = "apis.map.qq.com"
path = '^/(?:uri/v1/marker|tools/poimarker)$'
query = { marker = '^coord:(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)(?:;title:(?P<name>[^;]{1,64}))?(?:;addr:(?P<address>[^;]{0,128}))?$' }
kind = "place"
attrs = { coord_sys = "gcj02" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}", name = "{name}", address = "{address}" } }]

[[route]]            # 移动端地点组件页，同一种 marker 参数
id = "location-marker"
host = "mapapi.qq.com"
path = '^/web/mapComponents/locationMarker/v/index\.html$'
query = { marker = '^coord:(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)(?:;title:(?P<name>[^;]{1,64}))?(?:;addr:(?P<address>[^;]{0,128}))?$' }
kind = "place"
attrs = { coord_sys = "gcj02" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}", name = "{name}", address = "{address}" } }]

[[route]]            # 逆地址解析页：coord=<lat>,<lng>
id = "geocoder"
host = "apis.map.qq.com"
path = '^/uri/v1/geocoder$'
query = { coord = '^(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)$' }
kind = "place"
attrs = { coord_sys = "gcj02" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}" } }]

[[route]]            # 旧版 map.qq.com/?type=marker&pointx=<经度>&pointy=<纬度> —— 这里经度在前
id = "legacy-marker"
host = "map.qq.com"
path = '^/$'
query = { type = '^marker$', pointx = '^(?P<lng>-?[0-9]{1,3}\.[0-9]+)$', pointy = '^(?P<lat>-?[0-9]{1,2}\.[0-9]+)$' }
kind = "place"
attrs = { coord_sys = "gcj02" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}" } }]
