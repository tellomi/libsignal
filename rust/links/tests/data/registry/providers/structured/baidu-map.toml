schema = 1
id = "baidu-map"
name = { zh-Hans = "百度地图", en = "Baidu Maps" }
tier = "structured"
category = "maps"
# api.map.baidu.com/marker 302 到 map.baidu.com/?latlng=…（2026-09-27 实测）；j.map.baidu.com 短链展开到
# map.baidu.com/?shareurl=1&poiShareUid=<24 位十六进制>，只有 POI 号、没有坐标 → 品牌壳（要调百度接口才知道位置，不做）。
domains = ["api.map.baidu.com", "map.baidu.com"]
short_domains = ["j.map.baidu.com"]
strip_params = ["src", "output", "autoOpen", "da_src"]
evidence = "URI API 文档 https://lbsyun.baidu.com/faq/api?title=webapi/uri/web（location=纬度,经度；coord_type 缺省 bd09ll，可选 gcj02 / wgs84 / bd09mc）；ecosystem-2026-09-23/G1-maps-travel.md「百度地图」；2026-09-27 首批复核（#1419 PR）"

# marker 与 geocoder（逆地理）同一种 location 参数。coord_type 写明是哪种坐标系就按它；bd09mc 是墨卡托米制，不是经纬度，
# 那种 URL 的数值过不了下面的纬度正则（整数部分 ≤ 2 位），自然落到品牌壳。
[[route]]
id = "marker-gcj02"
host = "api.map.baidu.com"
path = '^/(?:marker|geocoder)$'
query = { location = '^(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)$', coord_type = '^gcj02$' }
kind = "place"
attrs = { coord_sys = "gcj02" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}" } }]

[[route]]
id = "marker-wgs84"
host = "api.map.baidu.com"
path = '^/(?:marker|geocoder)$'
query = { location = '^(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)$', coord_type = '^wgs84$' }
kind = "place"
attrs = { coord_sys = "wgs84" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}" } }]

[[route]]            # 带标题的标注：title 非空才算名字（文档示例里常见 title=&content= 空值）
id = "marker-named"
host = "api.map.baidu.com"
path = '^/marker$'
query = { location = '^(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)$', title = '^(?P<name>[^&]{1,64})$' }
kind = "place"
attrs = { coord_sys = "bd09" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}", name = "{name}" } }]

[[route]]            # 缺省坐标系 bd09ll（写明 coord_type=bd09ll 也走这里）
id = "marker"
host = "api.map.baidu.com"
path = '^/(?:marker|geocoder)$'
query = { location = '^(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)$' }
kind = "place"
attrs = { coord_sys = "bd09" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}" } }]

[[route]]            # marker 302 的落点：map.baidu.com/?latlng=<lat>,<lng>&title=…（跳转时保持 BD-09）
id = "latlng"
host = "map.baidu.com"
path = '^/$'
query = { latlng = '^(?P<lat>-?[0-9]{1,2}\.[0-9]+),(?P<lng>-?[0-9]{1,3}\.[0-9]+)$' }
kind = "place"
attrs = { coord_sys = "bd09" }
plan = [{ type = "url-only", map = { lat = "{lat}", lng = "{lng}" } }]
