schema = 1
id = "zhihu"
name = { zh-Hans = "知乎", en = "Zhihu" }
tier = "brand"
category = "social"
icon = "zhihu.png"
# 知乎没有分享短链：App 分享的是完整链接加 utm_psn / share_code（2026-09-27 检索）。大陆直连也是 403（C 档）。
domains = ["www.zhihu.com", "zhihu.com", "zhuanlan.zhihu.com"]
strip_params = ["utm_psn", "utmPsn", "share_code", "utm_*"]
evidence = "ecosystem-2026-09-23/G3-social-news.md「知乎」（直连 403，C 档）；2026-09-27 首批复核（#1419 PR）"

[[route]]            # 回答也写「问题」：卡片只写「知乎 · 问题」
id = "answer"
path = '^/question/(?P<qid>[0-9]{5,20})/answer/(?P<aid>[0-9]{5,20})/?$'
kind = "question"
object = "answer/{aid}"
plan = [{ type = "none" }]

[[route]]
id = "question"
path = '^/question/(?P<qid>[0-9]{5,20})/?$'
kind = "question"
object = "question/{qid}"
plan = [{ type = "none" }]

[[route]]
id = "column-article"
host = "zhuanlan.zhihu.com"
path = '^/p/(?P<id>[0-9]{5,20})/?$'
kind = "article"
object = "p/{id}"
plan = [{ type = "none" }]
