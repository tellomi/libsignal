schema = 1
id = "xiaohongshu"
name = { zh-Hans = "小红书", en = "Xiaohongshu" }
tier = "brand"
category = "social"
icon = "xiaohongshu.png"
# xhslink.com 是 App 分享短链（302 到 www.xiaohongshu.com/discovery/item/…，带 xsec_token 等）；笔记页不带 token 就跳登录（C 档）。
domains = ["www.xiaohongshu.com", "xiaohongshu.com"]
short_domains = ["xhslink.com"]
strip_params = ["xsec_token", "xsec_source", "app_platform", "app_version", "share_from_user_hidden", "type", "author_share", "xhsshare", "shareRedId", "apptime", "share_id", "ignoreEngage", "exSource"]
evidence = "ecosystem-2026-09-23/G3-social-news.md「小红书」（C 档）；2026-09-27 首批复核（#1419 PR）"

[[route]]            # 笔记：/explore/<24 位十六进制> 或 /discovery/item/<同一个号>
id = "note"
path = '^/(?:explore|discovery/item)/(?P<id>[0-9a-f]{24})/?$'
kind = "article"
object = "{id}"
plan = [{ type = "none" }]
