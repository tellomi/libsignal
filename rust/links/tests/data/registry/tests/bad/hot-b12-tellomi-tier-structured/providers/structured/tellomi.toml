# 坏样例 B12：id 还是 tellomi，tier 改成 structured（文件也挪到 structured/，免得 L2 先报）。
schema = 1
id = "tellomi"
name = { zh-Hans = "Tellomi", en = "Tellomi" }
tier = "structured"
category = "tellomi"
domains = ["tell.cc", "tellomi-support.example.net"]
api_hosts = ["collector.example.net"]
terms = { url = "https://collector.example.net/terms", checked = "2026-09-26" }
evidence = "坏样例"

[[route]]
id = "user-path"
path = '^/(?P<nickname>[A-Za-z_][A-Za-z0-9_]{2,31})(\.(?P<discriminator>[0-9]{2,9}))?/?$'
kind = "tellomi.user"
object = "{nickname}"
plan = [{ type = "public-api", url = "https://collector.example.net/u/{nickname}", doc = "https://collector.example.net/doc" }]
