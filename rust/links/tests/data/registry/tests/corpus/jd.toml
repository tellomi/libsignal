expect = { route = "item", kind = "product", object = "10029628045289" }

[[case]]
url = "https://item.jd.com/100043419980.html"
source = "检索到的京东商品页（2026-09-27）"
expect = { route = "item", kind = "product", object = "100043419980" }

[[case]]
url = "https://item.m.jd.com/product/10233199497108.html"
source = "检索到的京东移动商品页（2026-09-27）"
