# 品牌壳样本：第三方只收真实链接（不许编 ID）。2026-09-27 首批（#1419）由检索 + 本机实测收集，在线复核输出见 PR。
provider = "jd"

[[case]]
url = "https://3.cn/CdEyF2"
source = "检索到的京东短链（2026-09-27 大陆直连 302 到 http://h5.m.jd.com/dev/…）"
expect = { short = true }

[[case]]
url = "https://3.cn/1-jMkHBf"
source = "检索到的京东短链（2026-09-27 大陆直连 302 到 jos.jd.com/apilist?…）"
expect = { short = true }

[[case]]
url = "https://u.jd.com/EDB3Atu"
source = "检索到的京东推广短链（2026-09-27）：回 200 的 JS 跳转页、没有 Location，按域名出品牌壳"
expect = { route = "" }

[[case]]
url = "https://item.jd.com/10029628045289.html"
