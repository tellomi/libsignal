[[case]]
url = "https://api.map.baidu.com/marker?location=40.047669,116.313082&coord_type=wgs84&output=html&src=webapp.baidu.openAPIdemo"
source = "按 URI API 文档的格式写的坐标链接（坐标取自文档示例；coord_type=wgs84 是文档列出的取值）。坐标就是 URL 本身，README §6 允许；没找到外面流通的 wgs84 真实链接"
expect = { route = "marker-wgs84", kind = "place", captures = { lat = "40.047669", lng = "116.313082" } }
