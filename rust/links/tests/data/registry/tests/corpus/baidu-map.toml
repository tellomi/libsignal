[[case]]
url = "https://api.map.baidu.com/direction?origin=latlng:34.264642646862,108.95108518068|name:%E6%88%91%E5%AE%B6&destination=%E5%A4%A7%E9%9B%81%E5%A1%94&mode=driving&region=%E8%A5%BF%E5%AE%89&output=html&src=webapp.baidu.openAPIdemo"
