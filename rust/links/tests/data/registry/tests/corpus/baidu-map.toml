provider = "baidu-map"

[[case]]
url = "https://api.map.baidu.com/marker?location=40.047669,116.313082&title=%E6%88%91%E7%9A%84%E4%BD%8D%E7%BD%AE&content=%E7%99%BE%E5%BA%A6%E5%A5%8E%E7%A7%91%E5%A4%A7%E5%8E%A6&output=html&src=webapp.baidu.openAPIdemo"
source = "URI API 文档示例 https://lbsyun.baidu.com/faq/api?title=webapi/uri/web（原文 http，改成 https）；坐标是 URL 本身"
expect = { route = "marker-named", kind = "place", captures = { lat = "40.047669", lng = "116.313082", name = "我的位置" } }

[[case]]
url = "https://map.baidu.com/?latlng=40.047669,116.313082&title=%E6%88%91%E7%9A%84%E4%BD%8D%E7%BD%AE&content=%E7%99%BE%E5%BA%A6%E5%A5%8E%E7%A7%91%E5%A4%A7%E5%8E%A6&autoOpen=true"
source = "上一条 302 的落点（2026-09-27 大陆直连，Location 末尾的 &l 去掉）"
expect = { route = "latlng", kind = "place", captures = { lat = "40.047669", lng = "116.313082" } }

[[case]]
url = "https://api.map.baidu.com/geocoder?location=39.990912172420714,116.32715863448607&coord_type=gcj02&output=html&src=webapp.baidu.openAPIdemo"
source = "URI API 文档的逆地理示例（coord_type=gcj02；原文 http，改成 https）"
expect = { route = "marker-gcj02", kind = "place", captures = { lat = "39.990912172420714", lng = "116.32715863448607" } }

[[case]]
url = "https://api.map.baidu.com/marker?location=39.9088,116.3975&title=&content="
source = "G1 实测（title 为空：不算名字，按缺省 BD-09 标注）"
expect = { route = "marker", kind = "place", captures = { lat = "39.9088", lng = "116.3975" } }

[[case]]
