[package]
name = "tellomi-links"
authors.workspace = true
license.workspace = true
rust-version.workspace = true
version = "0.1.0"
edition = "2024"
description = "Tellomi link cards: sans-IO link identification, resolve plans, extraction, card classification and open rules (ADR-0063)"

[lints]
workspace = true

[dependencies]
# XEdDSA verification of registry updates with the Desktop update key (links/README.md §8).
libsignal-core = { workspace = true }
tellomi-policy = { workspace = true }

displaydoc = { workspace = true }
prost = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-security = { workspace = true }

# ADR-0063 §4.10: the public suffix list (registrable domain for the domain row and for lookalike
# checks). Crate MIT / Apache-2.0, list data MPL-2.0.
psl = "2.1.238"
# Registry patterns are compiled with the same engine the build step uses (README §8); linear time.
regex = "1.12.4"
# WHATWG URL parsing, IDNA → punycode, form-urlencoded query pairs.
url = "2.5.8"

[dev-dependencies]
# Tests sign throwaway registries with a fresh key.
rand = { workspace = true }
# Tests decode the tint sample images (ADR-0063 card-visual appendix A) from test resources.
png = "0.18.1"
# Tests read the registry fixtures in their source TOML form, as the builder does.
toml = "=1.1.2"
