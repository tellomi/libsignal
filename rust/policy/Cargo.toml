[package]
name = "tellomi-policy"
authors.workspace = true
license.workspace = true
rust-version = "1.85"
version = "0.1.0"
edition = "2024"
description = "Tellomi Policy Engine: reserved / brand / impersonation / regional lexicon matching for public identity fields (ADR-0062)"

[lints]
workspace = true

[dependencies]
aho-corasick = { workspace = true }
displaydoc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
unicode-security = { workspace = true }

sha2 = { workspace = true, optional = true }
usernames = { workspace = true, optional = true }

# Only the build-time binaries need these; clients get the engine without libsignal's username
# machinery or a hashing dependency.
[features]
build-tools = ["dep:usernames", "dep:sha2"]

[[bin]]
name = "policy-username-hashes"
required-features = ["build-tools"]

[dev-dependencies]
proptest = { workspace = true }
