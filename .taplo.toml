include = ["Cargo.toml", "rust/**/*.toml"]
# Tellomi: link registry fixtures are data copied from the tellomi/tellomi `links/` tree, not config.
exclude = ["rust/links/tests/data/**"]

[formatting]
align_comments = false
indent_string = '    '
reorder_keys = false

[[rule]]
include = ["**/Cargo.toml"]
keys = ["dependencies", "workspace.dependencies", "dev-dependencies", "build-dependencies"]

[rule.formatting]
inline_table_expand = false
reorder_keys = true
